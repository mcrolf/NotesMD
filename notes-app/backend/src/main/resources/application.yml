spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/notesMD}
    username: ${SPRING_DATASOURCE_USERNAME:notes}
    # Set SPRING_DATASOURCE_PASSWORD in the environment (see notes-app/.env.example); no committed default.
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    # Adopt databases that already have tables (e.g. legacy Hibernate) but no flyway_schema_history.
    # Baselines at 1 by default, then applies V2+ (users, note owner_id). Prefer a fresh DB or repair if you get duplicate-object errors.
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt:
    # HS256 signing key. Required, at least 32 bytes; startup fails on the .env.example placeholder.
    # Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:notesmd-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}

  auth:
    # Set false after creating your accounts to close sign-ups (POST /api/auth/register returns 403).
    registration-enabled: ${REGISTRATION_ENABLED:true}
    # Failed logins allowed per client address and username before a lockout window.
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lockout: ${LOGIN_LOCKOUT:PT15M}

  cors:
    # Comma-separated Origin values for /api/** and /actuator/** (override with CORS_ALLOWED_ORIGINS).
    # app://notesmd is the desktop app. `null` is only for desktop builds up to 1.0.3 (file://) and will be removed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,app://notesmd,null}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  writer-with-order-by-keys: true
  api-docs:
    # Public OpenAPI description at /v3/api-docs; NotesMD/docs/openapi.json is the checked-in copy.
    enabled: ${OPENAPI_DOCS_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}
